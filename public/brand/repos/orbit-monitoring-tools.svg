<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Gully Labs · Keep it healthy">
<title>Gully Labs · Keep it healthy</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
