<text x="66" y="300" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#6C7888">gully-labs/orbit-monitoring-tools · fork of OffchainLabs/orbit-monitoring-tools</text>
