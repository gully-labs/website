<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0B0E13"/><stop offset=".55" stop-color="#0B0E13" stop-opacity=".2"/><stop offset="1" stop-color="#0B0E13" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1280" height="360" fill="#0B0E13"/><rect width="1280" height="360" fill="url(#grid)"/><rect width="1280" height="360" fill="url(#glow)"/><rect width="760" height="360" fill="url(#fade)"/>
<rect x="0" y="0" width="1280" height="3" fill="#E8C060"/>
