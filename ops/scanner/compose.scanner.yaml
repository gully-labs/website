# gully-scanner, a separate compose file so a site deploy never touches it and it never touches anything
# else. Only gully-* resources. NOT started yet: the shared box's disk was at 97 % on 2026-10-18.
#
#   ./ops/scanner/preflight.sh                                  (refuses under 15 GB free / 3 GB RAM)
#   docker compose -p gully-scanner -f ops/scanner/compose.scanner.yaml up -d --build
#   docker network connect gully-scanner-net gully-web          (once, so the site can reach it)
#   then set in ~/gully-web/.env:  SCANNER_URL=http://gully-scanner:8090  SCANNER_TOKEN=<same token>
#
# The network is internal: the worker (and the code it reads) has no route to the internet. gully-web joins
# it as a second network and keeps its own outbound access.
name: gully-scanner
services:
  scanner:
    build:
      context: .
      args:
        WITH_SEMGREP: ${SCANNER_WITH_SEMGREP:-0}
    image: gully-scanner:${SCANNER_TAG:-latest}
    container_name: gully-scanner
    restart: unless-stopped
    environment:
      SCANNER_TOKEN: ${SCANNER_TOKEN:?set SCANNER_TOKEN (24+ random characters) in the environment}
      TOOL_TIMEOUT_SEC: "300"
    read_only: true
    tmpfs:
      - /work:size=1g,mode=1777
      - /tmp:size=256m,mode=1777
      - /home/scanner/.foundry/cache:size=64m,uid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
      fsize: 536870912
    networks: [gully-scanner-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  gully-scanner-net:
    name: gully-scanner-net
    internal: true
