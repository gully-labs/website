<!doctype html>
<!--
  Gully Labs: the page Cloudflare shows when the origin is down (521/522/523/502/504).
  Self-contained on purpose (no external fonts, scripts or images): Cloudflare serves it while our server is
  unreachable, so nothing on gullylabs.xyz can be loaded. Setup: ops/DEPLOY.md, "When the origin is down".
  ::CLOUDFLARE_ERROR_500S_BOX:: below is required by Cloudflare's legacy Custom Pages (5XX errors); it is
  replaced with the error details there. Remove that line for a Worker or Custom Errors asset.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="30">
<title>Back in a moment · Gully Labs</title>
<style>
  :root { color-scheme: dark; --bg: #0d141c; --surface: #151d28; --line: #1f2935; --ink: #f4f2ec; --muted: #aeb5be; --gold: #d9b563; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { display: grid; place-items: center; min-height: 100svh; padding: 24px 16px; font: 16px/1.55 "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 560px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 36px 28px; }
  .mark { font: 800 22px/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .mark b { color: var(--gold); font-weight: 800; }
  .pulse { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .pulse i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pulse i { animation-duration: 3s; } }
  h1 { margin: 12px 0 8px; font: 800 clamp(34px, 8vw, 48px)/1.02 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; text-transform: uppercase; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--gold); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--ink); }
  .links a:hover, .links a:focus-visible { border-color: var(--gold); outline: none; }
  .cf { margin-top: 24px; font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div class="mark">Gully <b>Labs</b></div>
  <div class="pulse" role="status"><i aria-hidden="true"></i>Updating</div>
  <h1>Back in a moment</h1>
  <p>We are restarting gullylabs.xyz, usually for a few seconds. This page reloads by itself every 30 seconds.</p>
  <p>Your API keys, alerts, payments and analytics are safe.</p>
  <div class="links">
    <a href="https://x.com/Gully_Labs">Gully Labs on X</a>
    <a href="mailto:team@gullylabs.xyz">team@gullylabs.xyz</a>
  </div>
  <div class="cf">::CLOUDFLARE_ERROR_500S_BOX::</div>
</main>
</body>
</html>
