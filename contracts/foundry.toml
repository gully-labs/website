# Fork tests that check the third-party payment contracts Gully Pay calls (see CHOICE.md).
# Gully Labs deploys no contract of its own. Run: forge test  (needs internet; reads live chain state)
[profile.default]
src = "test"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
# Every top-level call is its own transaction, so addresses start cold as on mainnet. That matters for the
# 2300-gas `transfer` test: in one big test transaction the Safe would already be warm and the bug would hide.
isolate = true
remappings = ["forge-std/=lib/forge-std/src/"]
