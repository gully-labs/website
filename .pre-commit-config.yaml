# Gully Labs: block secrets before they reach git history. Install once per clone:
#   pip install pre-commit  (or: brew install pre-commit)  then:  pre-commit install
# Uses the shared config .gitleaks.toml at the repo root (copy from gully-ops/.gitleaks.toml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml", "--redact"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
