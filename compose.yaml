# Only gully-* resources. Check both host ports are free before changing them.
name: gully
services:
  # The site. Deployed by ops/deploy.sh (ops/DEPLOY.md), NOT by `docker compose up`: the script builds this
  # service's image as gully-web:<sha>, runs it beside the live one with `docker run` (keep the environment,
  # volumes and network in ops/deploy.sh run_next() in step with this block), and the gully-edge proxy owns
  # the host ports and switches between the two without a gap. The `legacy` profile keeps a plain
  # `docker compose up -d` (for the blog, analytics or backups) from ever recreating gully-web. The old
  # one-container path stays as an emergency fallback, only after gully-edge is removed (ops/DEPLOY.md):
  # `docker compose --profile legacy up -d --build web`.
  web:
    profiles: ["legacy"]
    build:
      context: .
      # Public values baked into the bundle at build time (LI.FI swap, WalletConnect).
      args:
        VITE_LIFI_INTEGRATOR: ${VITE_LIFI_INTEGRATOR:-}
        VITE_LIFI_FEE: ${VITE_LIFI_FEE:-}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_JUPITER_FEE_BPS: ${VITE_JUPITER_FEE_BPS:-}
        VITE_JUPITER_FEE_ACCOUNT: ${VITE_JUPITER_FEE_ACCOUNT:-}
    image: gully-web:${GULLY_WEB_TAG:-latest}
    container_name: gully-web
    restart: unless-stopped
    environment:
      TLS_PORT: "8443"
      TRACKER_DATA: /data/tracker-history.json
      DATA_DIR: /data
    # Secrets (ADMIN_TOKEN, …) live in .env on the box only, never in the repo.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./certs:/certs:ro
      # The tracker's 7-day gap history, kept across redeploys.
      - gully-web-data:/data
    ports:
      # Local access for checks on the server.
      - "127.0.0.1:${GULLY_WEB_PORT:-8099}:8080"
      # Public port Cloudflare connects to (via an Origin Rule on gullylabs.xyz).
      - "0.0.0.0:${GULLY_PUBLIC_PORT:-2053}:8443"

  # The blog: open-source Ghost, self-hosted. No host port: gully-web forwards blog.gullylabs.xyz to
  # it over the project network (server/blog.mjs). Secrets (BLOG_DB_PASSWORD, BLOG_SETUP_TOKEN) are in
  # .env on the box only.
  blog:
    image: ghost:6-alpine
    container_name: gully-blog
    restart: unless-stopped
    depends_on:
      blog-db:
        condition: service_healthy
    environment:
      url: https://blog.gullylabs.xyz
      NODE_ENV: production
      database__client: mysql
      database__connection__host: gully-blog-db
      database__connection__user: ghost
      database__connection__password: ${BLOG_DB_PASSWORD:?set BLOG_DB_PASSWORD in .env}
      database__connection__database: ghost
      # No mail service yet: staff invites and member sign-in emails need SMTP set here later.
      mail__transport: Direct
    volumes:
      - gully-blog-content:/var/lib/ghost/content
    mem_limit: 768m

  blog-db:
    image: mysql:8.4
    container_name: gully-blog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${BLOG_DB_PASSWORD:?set BLOG_DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    volumes:
      - gully-blog-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ghost -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 640m

  # Gully Analytics: our Umami fork (github.com/gully-labs/umami, branch gully/analytics). No host
  # port: gully-web forwards analytics.gullylabs.xyz to it (server/analytics.mjs). The image is built
  # off the box and loaded with `docker load` (a Next.js build needs ~4 GB this shared box can't spare).
  # Secrets (ANALYTICS_DB_PASSWORD, ANALYTICS_APP_SECRET, ANALYTICS_2FA_KEY) are in .env on the box only.
  analytics:
    image: gully-analytics:${ANALYTICS_TAG:-latest}
    container_name: gully-analytics
    restart: unless-stopped
    depends_on:
      analytics-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gully:${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}@gully-analytics-db:5432/gully_analytics
      APP_SECRET: ${ANALYTICS_APP_SECRET:?set ANALYTICS_APP_SECRET in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${ANALYTICS_2FA_KEY:?set ANALYTICS_2FA_KEY in .env}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m

  analytics-db:
    image: postgres:16-alpine
    container_name: gully-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gully_analytics
      POSTGRES_USER: gully
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - gully-analytics-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gully -d gully_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # Nightly backups of every gully-* volume and database into gully-backups, kept 7 days (ops/backup.sh,
  # restore steps in ops/RESTORE.md). Read-only mounts of the data volumes.
  backup:
    image: postgres:16-alpine
    container_name: gully-backup
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      MODE: main
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - gully-web-data:/src/web:ro
      - gully-blog-content:/src/blog:ro
      - gully-backups:/backups
    depends_on:
      analytics-db:
        condition: service_healthy
    mem_limit: 256m

  # The blog database, dumped with MySQL's own client (MariaDB's cannot log in to MySQL 8.4).
  backup-blog:
    image: mysql:8.4
    container_name: gully-backup-blog
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      MODE: blog
      BLOG_DB_PASSWORD: ${BLOG_DB_PASSWORD:?set BLOG_DB_PASSWORD in .env}
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - gully-backups:/backups
    depends_on:
      blog-db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  gully-backups:
    name: gully-backups
  gully-analytics-db:
    name: gully-analytics-db
  gully-web-data:
    name: gully-web-data
  gully-blog-content:
    name: gully-blog-content
  gully-blog-mysql:
    name: gully-blog-mysql
